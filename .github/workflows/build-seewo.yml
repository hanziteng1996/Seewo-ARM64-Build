name: Build Seewo Board ARM64 App with Native Icon Merge

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'arm64'

      - name: Install Nativefier
        run: npm install -g nativefier

      # 原生 PowerShell 图标无损合成
      - name: Merge Icons via Native PowerShell Script
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $pngPaths = @(".\icon16.png", ".\icon32.png", ".\icon64.png")
          $icoPath = ".\logo.ico"
          $fs = New-Object System.IO.FileStream($icoPath, [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]$pngPaths.Count)
          $imageData = @()
          $offset = 6 + (16 * $pngPaths.Count)
          foreach ($path in $pngPaths) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $img = [System.Drawing.Image]::FromStream((New-Object System.IO.MemoryStream(,$bytes)))
              $bw.Write([Byte]$img.Width)
              $bw.Write([Byte]$img.Height)
              $bw.Write([Byte]0)
              $bw.Write([Byte]0)
              $bw.Write([UInt16]1)
              $bw.Write([UInt16]32)
              $bw.Write([UInt32]$bytes.Length)
              $bw.Write([UInt32]$offset)
              $imageData += ,$bytes
              $offset += $bytes.Length
              $img.Dispose()
          }
          foreach ($bytes in $imageData) {
              $bw.Write($bytes)
          }
          $bw.Close()
          $fs.Close()
          Write-Host "Success: logo.ico merged!"

      # 终极改良点 1：软件名称直接用纯英文 "seewo-arm64"，彻底根除云端系统对中文的乱码转译报错
      - name: Execute Nativefier Package
        run: |
          nativefier `
            --name "seewo-arm64" `
            "https://enweb3.seewo.com/" `
            --arch "arm64" `
            --platform "windows" `
            --icon ".\logo.ico" `
            --disable-gpu-sandbox `
            --no-old-sandbox `
            --widevine `
            --electron-version-string "32.0.0" `
            --internal-urls ".*" `
            --background-color "#ffffff"

      # 终极改良点 2：极其粗暴直接！把当前目录下生成的 seewo-arm64 开头的英文文件夹，直接原地压缩，绝不使用任何旧版 PowerShell 不支持的 `-Directory` 参数
      - name: Archive Production
        shell: powershell
        run: |
          $AppDir = Get-ChildItem | Where-Object { $_.PSIsContainer -and $_.Name -like "seewo-arm64*" } | Select-Object -First 1
          Compress-Archive -Path $AppDir.FullName -DestinationPath ".\Seewo-ARM64-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
