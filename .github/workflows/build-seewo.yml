name: Build Seewo Board ARM64 App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    runs-on: windows-11-arm
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # ← 升到 22，兜底 packager 引擎要求
          architecture: 'arm64'

      - name: Validate package.json
        run: npm install              # 无依赖，秒过，仅校验 package.json 合法

      - name: Merge Icons into logo.ico
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $pngPaths = @(".\icon16.png", ".\icon32.png", ".\icon64.png")
          $icoPath = ".\logo.ico"
          foreach ($p in $pngPaths) {
              if (-not (Test-Path $p)) { throw "Missing icon source: $p" }
          }
          $fs = New-Object System.IO.FileStream($icoPath, [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]$pngPaths.Count)
          $imageData = @()
          $offset = 6 + (16 * $pngPaths.Count)
          foreach ($path in $pngPaths) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $ms = New-Object System.IO.MemoryStream(,$bytes)
              $img = [System.Drawing.Image]::FromStream($ms)
              $w = if ($img.Width -ge 256) { 0 } else { $img.Width }
              $h = if ($img.Height -ge 256) { 0 } else { $img.Height }
              $bw.Write([Byte]$w); $bw.Write([Byte]$h); $bw.Write([Byte]0); $bw.Write([Byte]0)
              $bw.Write([UInt16]1); $bw.Write([UInt16]32)
              $bw.Write([UInt32]$bytes.Length); $bw.Write([UInt32]$offset)
              $imageData += ,$bytes
              $offset += $bytes.Length
              $img.Dispose(); $ms.Dispose()
          }
          foreach ($bytes in $imageData) { $bw.Write($bytes) }
          $bw.Close(); $fs.Close()
          Write-Host "Success: logo.ico merged!"

      - name: Package with Electron Packager (win32 arm64)
        shell: cmd
        run: |
          npx --yes --package=@electron/packager@latest electron-packager . seewo-arm64 --platform=win32 --arch=arm64 --electron-version=32.0.0 --icon=logo.ico --overwrite --asar --prune
          echo ===== PACKAGER_EXIT=%ERRORLEVEL% =====
          dir /ad /b

      - name: Archive Production
        shell: powershell
        run: |
          $cand = Get-ChildItem -Directory | Where-Object { $_.Name -like "seewo-arm64-win32-arm64" } | Select-Object -First 1
          if (-not $cand) { $cand = Get-ChildItem -Directory | Where-Object { $_.Name -like "seewo*arm64*" } | Select-Object -First 1 }
          if (-not $cand) { Write-Error "Packager output folder not found!"; exit 1 }
          Write-Host "Compressing: $($cand.FullName)"
          Compress-Archive -Path $cand.FullName -DestinationPath ".\Seewo-ARM64-Windows.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Seewo-ARM64-Windows.zip
          generate_release_notes: true
