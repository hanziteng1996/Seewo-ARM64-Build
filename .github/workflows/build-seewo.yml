name: Build Seewo Board ARM64 App with Native Icon Merge

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'arm64'

      - name: Install Nativefier
        run: npm install -g nativefier

      # 核心改良：使用 Windows 11 原生 PowerShell GDI+ 引擎进行多尺寸图标合成，彻底断绝外部工具报错
      - name: Merge Icons via Native PowerShell Script
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          
          # 创建图标多尺寸合并逻辑，精确对应你下载的三个分辨率
          $pngPaths = @(".\icon16.png", ".\icon32.png", ".\icon64.png")
          $icoPath = ".\logo.ico"
          
          $fs = New-Object System.IO.FileStream($icoPath, [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          
          # 写入 ICO 文件头 (ICONHEADER)
          $bw.Write([UInt16]0) # Reserved
          $bw.Write([UInt16]1) # Type (1 = ICO)
          $bw.Write([UInt16]$pngPaths.Count) # 图像帧数量
          
          $imageData = @()
          $offset = 6 + (16 * $pngPaths.Count)
          
          foreach ($path in $pngPaths) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $img = [System.Drawing.Image]::FromStream((New-Object System.IO.MemoryStream(,$bytes)))
              
              # 写入单个图标描述信息 (ICONDIRENTRY)
              $bw.Write([Byte]$img.Width)
              $bw.Write([Byte]$img.Height)
              $bw.Write([Byte]0) # Color count
              $bw.Write([Byte]0) # Reserved
              $bw.Write([UInt16]1) # Color planes
              $bw.Write([UInt16]32) # Bits per pixel
              $bw.Write([UInt32]$bytes.Length) # Image size
              $bw.Write([UInt32]$offset) # File offset
              
              $imageData += ,$bytes
              $offset += $bytes.Length
              $img.Dispose()
          }
          
          foreach ($bytes in $imageData) {
              $bw.Write($bytes)
          }
          
          $bw.Close()
          $fs.Close()
          Write-Host "Success: logo.ico has been perfectly merged via GDI+!"

      # 执行 100% 原生构建
      - name: Execute Nativefier Package
        run: |
          nativefier `
            --name "希沃白板5-ARM64社区版" `
            "https://enweb3.seewo.com/" `
            --arch "arm64" `
            --platform "windows" `
            --icon ".\logo.ico" `
            --disable-gpu-sandbox `
            --no-old-sandbox `
            --widevine `
            --electron-version-string "32.0.0" `
            --file-download-options "{\`"openFolderWhenDone\`": true}" `
            --internal-urls ".*" `
            --background-color "#ffffff"

      - name: Archive Production
        shell: powershell
        run: |
          $DirName = Get-ChildItem -Directory -Filter "*希沃*" | Select-Object -First 1 -ExpandProperty Name
          Compress-Archive -Path ".\$DirName" -DestinationPath ".\Seewo-ARM64-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
