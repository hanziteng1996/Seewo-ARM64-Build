name: Build Seewo Board ARM64 App with Native Icon Merge

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest # 官方托管x64即可交叉编译arm64，windows-11-arm仅自有大机器可用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Merge Icons via Native PowerShell Script
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $pngPaths = @(".\icon16.png", ".\icon32.png", ".\icon64.png")
          foreach ($p in $pngPaths) { if (-not (Test-Path $p)) { Write-Error "缺失图标文件 $p"; exit 1 } }
          $icoPath = ".\logo.ico"
          $fs = New-Object System.IO.FileStream($icoPath, [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]$pngPaths.Count)
          $imageData = @()
          $offset = 6 + (16 * $pngPaths.Count)
          foreach ($path in $pngPaths) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $img = [System.Drawing.Image]::FromStream((New-Object System.IO.MemoryStream(,$bytes)))
              $bw.Write([Byte]$img.Width)
              $bw.Write([Byte]$img.Height)
              $bw.Write([Byte]0)
              $bw.Write([Byte]0)
              $bw.Write([UInt16]1)
              $bw.Write([UInt16]32)
              $bw.Write([UInt32]$bytes.Length)
              $bw.Write([UInt32]$offset)
              $imageData += ,$bytes
              $offset += $bytes.Length
              $img.Dispose()
          }
          foreach ($bytes in $imageData) { $bw.Write($bytes) }
          $bw.Close()
          $fs.Close()
          Write-Host "ICO图标合成完成"

      # Nativefier 纯单行命令，杜绝反引号换行YAML缩进错误
      - name: Execute Nativefier Package
        run: nativefier --name "seewo-arm64" "https://enweb3.seewo.com/" --arch arm64 --platform windows --icon .\logo.ico --disable-gpu-sandbox --no-old-sandbox --widevine --electron-version 32.0.0 --internal-urls ".*" --background-color "#ffffff" --out .\build-output

      # 极简单行打包，云端Runner零语法报错
      - name: Archive Production
        shell: powershell
        run: Compress-Archive -LiteralPath "$(Get-ChildItem .\build-output -Directory | Select-Object -First 1).FullName" -DestinationPath ".\Seewo-ARM64-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
