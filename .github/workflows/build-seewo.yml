name: Build Seewo Board ARM64 App with Native Icon Merge

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'arm64'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Merge Icons via Native PowerShell Script
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $pngPaths = @(".\icon16.png", ".\icon32.png", ".\icon64.png")
          $icoPath = ".\logo.ico"
          foreach ($p in $pngPaths) {
              if (-not (Test-Path $p)) { throw "Missing icon source: $p" }
          }
          $fs = New-Object System.IO.FileStream($icoPath, [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]$pngPaths.Count)
          $imageData = @()
          $offset = 6 + (16 * $pngPaths.Count)
          foreach ($path in $pngPaths) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $ms = New-Object System.IO.MemoryStream(,$bytes)
              $img = [System.Drawing.Image]::FromStream($ms)
              $w = if ($img.Width -ge 256) { 0 } else { $img.Width }
              $h = if ($img.Height -ge 256) { 0 } else { $img.Height }
              $bw.Write([Byte]$w)
              $bw.Write([Byte]$h)
              $bw.Write([Byte]0)
              $bw.Write([Byte]0)
              $bw.Write([UInt16]1)
              $bw.Write([UInt16]32)
              $bw.Write([UInt32]$bytes.Length)
              $bw.Write([UInt32]$offset)
              $imageData += ,$bytes
              $offset += $bytes.Length
              $img.Dispose()
              $ms.Dispose()
          }
          foreach ($bytes in $imageData) { $bw.Write($bytes) }
          $bw.Close(); $fs.Close()
          Write-Host "Success: logo.ico merged!"

      - name: Execute Nativefier Package
        shell: cmd
        run: |
          nativefier --name seewo-arm64 https://enweb3.seewo.com/ --arch arm64 --platform windows --icon logo.ico --electron-version 32.0.0 --background-color #ffffff
          set RC=%ERRORLEVEL%
          echo ===== NATIVEFIER_EXIT=%RC% =====
          echo ----- top dirs -----
          dir /ad /b
          dir /s /b seewo*.exe >nul 2>nul
          if errorlevel 1 (
            echo !!! NO seewo exe produced.
            exit /b 1
          )
          exit /b %RC%

      - name: Archive Production
        shell: powershell
        run: |
          $cand = Get-ChildItem -Directory | Where-Object { $_.Name -like "seewo*" } | Select-Object -First 1
          if (-not $cand) { $cand = Get-ChildItem -Directory | Where-Object { $_.Name -like "*arm64*" } | Select-Object -First 1 }
          if (-not $cand) { Write-Error "Build output folder not found!"; exit 1 }
          Write-Host "Compressing: $($cand.FullName)"
          Compress-Archive -Path $cand.FullName -DestinationPath ".\Seewo-ARM64-Windows.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
