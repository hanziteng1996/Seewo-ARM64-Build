name: Build Seewo Board ARM64 App with Custom Icon

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'arm64'

      - name: Install Nativefier
        run: npm install -g nativefier

      # 核心新增步骤：自动从公开 CDN 抓取社区通用的蓝色/绿色微调白板图标（格式必须是标准的 Windows 多尺寸 .ico）
      - name: Download Community Icon
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://icons8.com" -OutFile ".\seewo_community.ico"

      # 执行云端原生构建，加入了 --icon 路径锁定图标参数
      - name: Execute Nativefier Package
        run: |
          nativefier `
            --name "希沃白板5-ARM64社区版" `
            "https://enweb3.seewo.com/" `
            --arch "arm64" `
            --platform "windows" `
            --icon ".\seewo_community.ico" `
            --disable-gpu-sandbox `
            --no-old-sandbox `
            --widevine `
            --electron-version-string "32.0.0" `
            --file-download-options "{\`"openFolderWhenDone\`": true}" `
            --internal-urls ".*" `
            --background-color "#ffffff"

      - name: Archive Production
        shell: powershell
        run: |
          $DirName = Get-ChildItem -Directory -Filter "*希沃*" | Select-Object -First 1 -ExpandProperty Name
          Compress-Archive -Path ".\$DirName" -DestinationPath ".\Seewo-ARM64-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
