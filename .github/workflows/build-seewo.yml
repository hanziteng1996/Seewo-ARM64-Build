name: Build Seewo Board ARM64 App with Native Icon Merge

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'arm64'

      - name: Install Nativefier
        run: npm install -g nativefier

      # 原生 PowerShell 图标无损合成
      - name: Merge Icons via Native PowerShell Script
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $pngPaths = @(".\icon16.png", ".\icon32.png", ".\icon64.png")
          $icoPath = ".\logo.ico"
          $fs = New-Object System.IO.FileStream($icoPath, [System.IO.FileMode]::Create)
          $bw = New-Object System.IO.BinaryWriter($fs)
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]$pngPaths.Count)
          $imageData = @()
          $offset = 6 + (16 * $pngPaths.Count)
          foreach ($path in $pngPaths) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $img = [System.Drawing.Image]::FromStream((New-Object System.IO.MemoryStream(,$bytes)))
              $bw.Write([Byte]$img.Width)
              $bw.Write([Byte]$img.Height)
              $bw.Write([Byte]0)
              $bw.Write([Byte]0)
              $bw.Write([UInt16]1)
              $bw.Write([UInt16]32)
              $bw.Write([UInt32]$bytes.Length)
              $bw.Write([UInt32]$offset)
              $imageData += ,$bytes
              $offset += $bytes.Length
              $img.Dispose()
          }
          foreach ($bytes in $imageData) {
              $bw.Write($bytes)
          }
          $bw.Close()
          $fs.Close()
          Write-Host "Success: logo.ico merged!"

      # 去掉 --output 约束，让它以默认最高效的方式自由打包
      - name: Execute Nativefier Package
        run: |
          nativefier `
            --name "希沃白板5-ARM64社区版" `
            "https://enweb3.seewo.com/" `
            --arch "arm64" `
            --platform "windows" `
            --icon ".\logo.ico" `
            --disable-gpu-sandbox `
            --no-old-sandbox `
            --widevine `
            --electron-version-string "32.0.0" `
            --internal-urls ".*" `
            --background-color "#ffffff"

      # 降维打击：在整个工作区内全自动扫描包含“希沃”名字的最终打包产物文件夹，完美规避路径找不到的硬伤
      - name: Archive Production
        shell: powershell
        run: |
          $TargetDir = Get-ChildItem -Path "D:\a\*" -Directory -Filter "*希沃白板*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($TargetDir) {
              Write-Host "Found build folder at: $($TargetDir.FullName)"
              Compress-Archive -Path $TargetDir.FullName -DestinationPath ".\Seewo-ARM64-Windows.zip"
          } else {
              Write-Error "Error: Build folder not found anywhere in workspace!"
              exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
