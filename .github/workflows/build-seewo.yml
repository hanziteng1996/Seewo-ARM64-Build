name: Build Seewo Board ARM64 App with Auto-Merged Icon

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'arm64'

      - name: Install Nativefier
        run: npm install -g nativefier

      # 核心新增：在云端全自动安装官方图像处理引擎，把你的三张图合成为标准的 Windows 复合多尺寸 ICO
      - name: Setup ImageMagick & Merge Icons
        shell: powershell
        run: |
          choco install imagemagick --no-progress -y
          # 使用 ImageMagick 将 16, 32, 64 三个分辨率融合成一个标准的多维复合 logo.ico
          magick convert .\icon16.png .\icon32.png .\icon64.png .\logo.ico

      # 100% 本地读取刚刚合成好的完美图标进行满血构建
      - name: Execute Nativefier Package
        run: |
          nativefier `
            --name "希沃白板5-ARM64社区版" `
            "https://enweb3.seewo.com/" `
            --arch "arm64" `
            --platform "windows" `
            --icon ".\logo.ico" `
            --disable-gpu-sandbox `
            --no-old-sandbox `
            --widevine `
            --electron-version-string "32.0.0" `
            --file-download-options "{\`"openFolderWhenDone\`": true}" `
            --internal-urls ".*" `
            --background-color "#ffffff"

      - name: Archive Production
        shell: powershell
        run: |
          $DirName = Get-ChildItem -Directory -Filter "*希沃*" | Select-Object -First 1 -ExpandProperty Name
          Compress-Archive -Path ".\$DirName" -DestinationPath ".\Seewo-ARM64-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seewo-ARM64-Desktop-App
          path: Seewo-ARM64-Windows.zip
          retention-days: 5
